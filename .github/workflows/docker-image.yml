name: 🎨 Ollama Z-Image Turbo Generate Upload

on:
  workflow_dispatch:
env:
  MODEL_NAME: "x/z-image-turbo"
  PROMPT: "一只戴墨镜的猫坐在东京街头.赛博朋克风格.霓虹灯.电影摄影.8K"
jobs:
  ollama-test:
    #################################################
    # 🐧 Linux 系列
    #################################################
    # 🐧 Ubuntu 最新版（会随 GitHub 更新）
    #runs-on: ubuntu-latest

    # 🐧 Ubuntu 24.04 (推荐新项目)
    #runs-on: ubuntu-24.04

    # 🐧 Ubuntu 22.04
    #runs-on: ubuntu-22.04

    #################################################
    # 🍎 macOS 系列
    #################################################
    # 🍎 Intel Mac
    #runs-on: macos-13

    # 🍎 Apple Silicon M 系列
    #runs-on: macos-14

    # 🍎 Apple Silicon M 系列
    runs-on: macos-14-xlarge

    # 🍎 Apple Silicon M 系列（更新版本）
    #runs-on: macos-15

    #################################################
    # 🪟 Windows 系列
    #################################################
    # 🪟 Windows Server 2025
    #runs-on: windows-2025

    # 🪟 Windows Server 2022
    #runs-on: windows-2022

    # 🪟 Windows 最新
    #runs-on: windows-latest

    #################################################
    steps:
    - name: 1️⃣ 🔍 检查运行硬件
      run: |
        echo "===== 系统架构 ====="
        ARCH=$(uname -m)
        echo "当前架构: $ARCH"
        echo ""
        echo "===== 判断结果 ====="

        if [ "$ARCH" = "arm64" ]; then
          echo "🍎 检测到 ARM64 架构"
          echo "✅ 可能是 Apple Silicon (M1/M2/M3/M4)"
        elif [ "$ARCH" = "x86_64" ]; then
          echo "💻 检测到 x86_64 架构"
          echo "⚠️ 当前不是 Apple Silicon"
        else
          echo "❓ 未知架构: $ARCH"
        fi

        echo ""
        echo "===== 硬件详细信息 ====="
        if command -v system_profiler >/dev/null 2>&1
        then
          system_profiler SPHardwareDataType
        else
          echo "当前系统不是 macOS,跳过 Apple 硬件检测"

        fi

    - name: 2️⃣ 🧗 登陆 Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        pip install -U huggingface_hub
        hf auth login --token "$HF_TOKEN"

    - name: 3️⃣ 🐑 macOS M 系列安装 Ollama
      run: |
        echo "📥 Download Ollama..."
        curl -L https://ollama.com/download/Ollama-darwin.zip \
        -o ollama.zip
        unzip -q ollama.zip
        sudo mv Ollama.app /Applications/
        echo "🔧 Add ollama binary"
        sudo ln -sf /Applications/Ollama.app/Contents/Resources/ollama \
        /usr/local/bin/ollama
        ollama --version

    - name: 4️⃣ 🚀 启动 Ollama Server
      run: |
        echo "Starting Ollama..."
        nohup ollama serve \
        > ollama.log 2>&1 &
        echo "Waiting..."
        for i in {1..60}
        do
          if curl -s http://127.0.0.1:11434/api/tags >/dev/null
          then
            echo "✅ Ollama Ready"
            break
          fi
          sleep 1
        done

    - name: 5️⃣ 📦 从 ollama 下载图片模型
      run: |
        echo "模型:"
        echo $MODEL_NAME
        ollama pull $MODEL_NAME

    - name: 6️⃣ 🎨 AI 图片生成
      run: |
        mkdir -p results
        echo "Prompt:"
        echo "$PROMPT"
        echo "开始生成..."
        ollama run \
        $MODEL_NAME \
        "$PROMPT"
        echo ""
        echo "===== 搜索生成图片 ====="
        find ~ \
        -type f \
        \( \
        -iname "*.png" \
        -o \
        -iname "*.jpg" \
        -o \
        -iname "*.jpeg" \
        \) \
        2>/dev/null \
        | tee results/image-list.txt

    - name: 7️⃣ 📁 收集生成结果
      run: |
        mkdir -p results/images
        echo "复制图片..."
        while read file
        do
          if [ -f "$file" ]
          then
            cp "$file" results/images/
          fi
        done < results/image-list.txt
        echo ""
        echo "===== Results ====="
        ls -lh results/images
        echo "$PROMPT" \
        > results/prompt.txt

    - name: 7️⃣ ☁️ 安装 rclone
      run: |
        curl https://rclone.org/install.sh \
        | sudo bash

    - name: 8️⃣ 🔑 配置 Google Drive
      env:
        DRIVE_CONFIG:
          ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      run: |
        mkdir -p ~/.config/rclone
        echo "$DRIVE_CONFIG" \
        > ~/.config/rclone/rclone.conf

    - name: 9️⃣ 🚀 上传图片结果
      run: |
        echo "上传结果..."
        rclone copy \
        results \
        feadxus-Google-Drive:Models/Z-Image-Test/ \
        --progress
        echo "🎉 上传完成"
