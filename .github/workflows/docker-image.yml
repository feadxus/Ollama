name: 🤖 Ollama Model Download Test Upload

on:
  workflow_dispatch:
env:
  MODEL_NAME: "hf.co/MaziyarPanahi/Llama-3.2-3B-Instruct-uncensored-GGUF:Q8_0"
  # feadxus/Llama3.2-24B-A3B-II-Dark-Champion-INSTRUCT-Heretic-Abliterated-Uncensored:Q4_K_S

jobs:
  ollama-test:
    #################################################
    # 🐧 Linux 系列
    #################################################
    # 🐧 Ubuntu 最新版（会随 GitHub 更新）
    #runs-on: ubuntu-latest

    # 🐧 Ubuntu 24.04 (推荐新项目)
    #runs-on: ubuntu-24.04

    # 🐧 Ubuntu 22.04
    #runs-on: ubuntu-22.04

    #################################################
    # 🍎 macOS 系列
    #################################################
    # 🍎 Intel Mac
    #runs-on: macos-13

    # 🍎 Apple Silicon M 系列
    runs-on: macos-14

    # 🍎 Apple Silicon M 系列（更新版本）
    #runs-on: macos-15

    #################################################
    # 🪟 Windows 系列
    #################################################
    # 🪟 Windows Server 2025
    #runs-on: windows-2025

    # 🪟 Windows Server 2022
    #runs-on: windows-2022

    # 🪟 Windows 最新
    #runs-on: windows-latest

    #################################################
    steps:
    - name: 1️⃣ 🔍 检查运行硬件
      run: |
        echo "===== 系统架构 ====="
        ARCH=$(uname -m)
        echo "当前架构: $ARCH"
        echo ""
        echo "===== 判断结果 ====="

        if [ "$ARCH" = "arm64" ]; then
          echo "🍎 检测到 ARM64 架构"
          echo "✅ 可能是 Apple Silicon (M1/M2/M3/M4)"
        elif [ "$ARCH" = "x86_64" ]; then
          echo "💻 检测到 x86_64 架构"
          echo "⚠️ 当前不是 Apple Silicon"
        else
          echo "❓ 未知架构: $ARCH"
        fi

        echo ""
        echo "===== 硬件详细信息 ====="
        if command -v system_profiler >/dev/null 2>&1
        then
          system_profiler SPHardwareDataType
        else
          echo "当前系统不是 macOS,跳过 Apple 硬件检测"

        fi

    - name: 2️⃣ 🧗 登陆 Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        pip install -U huggingface_hub
        hf auth login --token "$HF_TOKEN"

    - name: 3️⃣ 🐑 macOS M 系列安装 Ollama
      run: |
        echo "📥 Download Ollama..."
        curl -L https://ollama.com/download/Ollama-darwin.zip \
        -o ollama.zip
        unzip -q ollama.zip
        sudo mv Ollama.app /Applications/
        echo "🔧 Add ollama binary"
        sudo ln -sf /Applications/Ollama.app/Contents/Resources/ollama \
        /usr/local/bin/ollama
        ollama --version

    - name: 4️⃣ 🚀 启动 Ollama Server
      run: |
        echo "Starting Ollama..."
        nohup ollama serve \
        > ollama.log 2>&1 &
        echo "Waiting..."
        for i in {1..60}
        do
          if curl -s http://127.0.0.1:11434/api/tags >/dev/null
          then
            echo "✅ Ollama Ready"
            break
          fi
          sleep 1
        done

    - name: 5️⃣ 📦 Pull Model
      run: |
        echo "Downloading:"
        echo $MODEL_NAME
        ollama pull $MODEL_NAME

    - name: 6️⃣ 🧠 AI能力测试
      run: |
        mkdir -p results
        cat > questions.txt <<EOF
        问题1:
        请解释 Docker 的 network_mode host 和 bridge 区别.
        问题2:
        Home Assistant 使用 MQTT 通讯的工作流程是什么?
        问题3:
        写一个 docker-compose 部署 Mosquitto MQTT 服务.
        问题4:
        Python asyncio 和多线程有什么区别?
        问题5:
        如果一个 Linux 服务启动失败,应该如何排查?
        EOF
        echo "开始AI测试..."
        ollama run $MODEL_NAME \
        < questions.txt \
        > results/answer.txt
        echo "========测试结果========"
        cat results/answer.txt

    - name: 7️⃣ 📤 保存测试结果
      uses: actions/upload-artifact@v4
      with:
        name: ollama-test-result
        path:
          results/answer.txt

    - name: 8️⃣ 📦 打包模型
      run: |
        echo "Searching model directory..."

        MODEL_DIR=$(find / -path "*ollama/models" \
        -type d 2>/dev/null | head -1)

        echo "Found:"
        echo $MODEL_DIR

        tar -czvf ollama-model.tar.gz \
        -C $MODEL_DIR \
        models

        ls -lh ollama-model.tar.gz

    - name: 9️⃣ ☁️ 安装 rclone
      run: |
        curl https://rclone.org/install.sh | sudo bash

    - name: 🔟 🔑 配置Google Drive
      env:
        DRIVE_CONFIG:
          ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      run: |
        mkdir -p ~/.config/rclone
        echo "$DRIVE_CONFIG" \
        > ~/.config/rclone/rclone.conf

    - name: 1️⃣1️⃣ 🚀 上传
      run: |
        rclone copy \
        ollama-model.tar.gz \
        feadxus-Google-Drive:Models/ \
        --progress

        rclone copy \
        results \
        feadxus-Google-Drive:Models/TestResults/ \
        --progress

        echo "🎉 全部完成"
