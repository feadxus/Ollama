name: Download Model and Upload to Cloud Storage

on:
  workflow_dispatch:

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    
    # 🎯 全局共享变量:只在这里定义一次,后续所有 Step 统统通用!
    env:
      USERNAME: "feadxus"
      DOMAIN: "huggingface.co"
      HF_MODEL: "ponpoke/flux2-klein-9b-uncensored-text-encoder:flux2-klein-9b-uncensored-f16.gguf"
      FILE_TAG: "flux2-klein-9b-uncensored:F16"

    steps:
      # 0️⃣. 登陆 Hugging Face
      - name: Login to Hugging Face via CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          hf auth login --token "$HF_TOKEN"

      # 1️⃣. 安装 Ollama
      - name: Install Ollama
        run: |
          echo "📥 安装 Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh

      # 2️⃣. 🔑 注入密钥 (让 Actions 拿到账号的推送权限)
      - name: Inject Ollama Keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OLLAMA_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.OLLAMA_PUBLIC_KEY }}
        run: |
          echo "🔑 正在写入 Ollama 身份密钥..."
          
          # 1. 写入用户主目录
          mkdir -p $HOME/.ollama
          echo "$SSH_PRIVATE_KEY" > $HOME/.ollama/id_ed25519
          echo "$SSH_PUBLIC_KEY" > $HOME/.ollama/id_ed25519.pub
          chmod 600 $HOME/.ollama/id_ed25519
          chmod 644 $HOME/.ollama/id_ed25519.pub

          # 2. 同步写入后台 service 目录(防止部分系统环境中 ollama serve 读不到)
          sudo mkdir -p /usr/share/ollama/.ollama
          sudo cp -r $HOME/.ollama/* /usr/share/ollama/.ollama/
          sudo chmod 600 /usr/share/ollama/.ollama/id_ed25519
          sudo chmod 644 /usr/share/ollama/.ollama/id_ed25519.pub

      # 3️⃣. 启动 Ollama 后台服务
      - name: Start Ollama Service
        run: |
          echo "🚀 在后台启动 Ollama 服务..."
          nohup ollama serve > ollama.log 2>&1 &

          echo "⏳ 等待 Ollama 后台服务就绪..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "✅ Ollama 服务已成功运行!"
              break
            fi
            echo "正在重试 ($i/30)..."
            sleep 1
          done

      # 4️⃣. 直链下载、构建并推送到个人 Hub
      - name: Download GGUF, Build and Validate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. 下载参数配置
          # 用户名
          USERNAME="feadxus"
          # 域名地址
          DOMAIN="huggingface.co"
          # 🎯 仓库地址
          HF_PATH="wikeeyang/Flux2-Klein-9B-True-V2"
          # 🎯 模型文件名
          FILENAME="Flux2-Klein-9B-True-v2-Q6_K.gguf"
          # 🎯 上传的模型名称
          FILE_TAG="Flux2-Klein-9B-True-:v2-Q6_K"
          # 完整的上传模型名称
          TARGET_REPO="${USERNAME}/${FILE_TAG}"

          echo "📥 1. 使用 wget 直链下载 GGUF 权重..."
          wget -q --show-progress \
            --header="Authorization: Bearer $HF_TOKEN" \
            -c "https://$DOMAIN/$HF_PATH/resolve/main/$FILENAME" \
            -O model.gguf

          echo "📄 2. 生成 Modelfile..."
          echo "FROM ./model.gguf" > Modelfile

          echo "🔨 3. 导入并打包模型..."
          ollama create $TARGET_REPO -f Modelfile

          echo "🔍 4. 【安全校验】检查本地模型列表..."
          ollama list | grep "$USERNAME"

          echo "🔍 5. 【安全校验】打印模型结构详情..."
          ollama show $TARGET_REPO

          echo "🚀 6. 推送到 Ollama Hub..."
          ollama push $TARGET_REPO

          echo "🧹 7. 清理 Runner 磁盘空间..."
          rm -f model.gguf Modelfile
