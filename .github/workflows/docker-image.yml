name: Download Model and Upload to Cloud Storage

on:
  workflow_dispatch:

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      # ====================================================================
      # 腾出空间!通过卸载不需要的 Android、.NET 等工具,释放出约 30GB+ 空间
      # ====================================================================
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: 查看清理前磁盘空间
        run: df -h /

      - name: 删除 .NET SDK(/usr/share/dotnet)
        run: sudo rm -rf /usr/share/dotnet
      - name: 删除 Android SDK(/usr/local/lib/android)
        run: sudo rm -rf /usr/local/lib/android
      - name: 删除语言工具缓存(/opt/hostedtoolcache)
        run: sudo rm -rf /opt/hostedtoolcache
      - name: 删除 PowerShell(/usr/local/share/powershell)
        run: sudo rm -rf /usr/local/share/powershell
      - name: 删除 Chromium(/usr/local/share/chromium)
        run: sudo rm -rf /usr/local/share/chromium
      - name: 删除 Swift 工具链(/usr/share/swift)
        run: sudo rm -rf /usr/share/swift
      - name: 删除 Java JDK(/usr/lib/jvm)
        run: sudo rm -rf /usr/lib/jvm
      - name: 删除 Azure CLI 工具(/opt/az)
        run: sudo rm -rf /opt/az
      - name: 删除微软工具链(/opt/microsoft)
        run: sudo rm -rf /opt/microsoft

      - name: 查看清理后磁盘空间
        run: df -h


      # 0️⃣. 登陆 Hugging Face
      - name: Login to Hugging Face via CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          hf auth login --token "$HF_TOKEN"

      # 1️⃣. 安装 Ollama
      - name: Install Ollama
        run: |
          echo "📥 安装 Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh

      # 2️⃣. 🔑 注入密钥 (让 Actions 拿到账号的推送权限)
      - name: Inject Ollama Keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OLLAMA_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.OLLAMA_PUBLIC_KEY }}
        run: |
          echo "🔑 正在写入 Ollama 身份密钥..."
          
          # 1. 写入用户主目录
          mkdir -p $HOME/.ollama
          echo "$SSH_PRIVATE_KEY" > $HOME/.ollama/id_ed25519
          echo "$SSH_PUBLIC_KEY" > $HOME/.ollama/id_ed25519.pub
          chmod 600 $HOME/.ollama/id_ed25519
          chmod 644 $HOME/.ollama/id_ed25519.pub

          # 2. 同步写入后台 service 目录(防止部分系统环境中 ollama serve 读不到)
          sudo mkdir -p /usr/share/ollama/.ollama
          sudo cp -r $HOME/.ollama/* /usr/share/ollama/.ollama/
          sudo chmod 600 /usr/share/ollama/.ollama/id_ed25519
          sudo chmod 644 /usr/share/ollama/.ollama/id_ed25519.pub

      # 3️⃣. 启动 Ollama 后台服务
      - name: Start Ollama Service
        run: |
          echo "🚀 在后台启动 Ollama 服务..."
          nohup ollama serve > ollama.log 2>&1 &

          echo "⏳ 等待 Ollama 后台服务就绪..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "✅ Ollama 服务已成功运行!"
              break
            fi
            echo "正在重试 ($i/30)..."
            sleep 1
          done

      # 4️⃣. 直链下载、构建并推送到个人 Hub
      - name: Download GGUF, Build and Validate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. 下载参数配置
          # 用户名
          USERNAME="feadxus"
          # HF地址
          DOMAIN="huggingface.co"

          # 🎯 仓库地址
          HF_PATH="MaziyarPanahi/Llama-3.2-3B-Instruct-uncensored-GGUF"
          # 🎯 模型文件名
          FILENAME="Llama-3.2-3B-Instruct-uncensored.fp16.gguf"
          # 🎯 上传的模型名称
          FILE_TAG="Llama-3.2-3B-Instruct-uncensored:FP16"
 
          # 完整拼接地址
          TARGET_REPO="${USERNAME}/${FILE_TAG}"

          echo "📥 1. 使用 wget 直链下载 GGUF 权重..."
          wget -q --show-progress \
            --header="Authorization: Bearer $HF_TOKEN" \
            -c "https://$DOMAIN/$HF_PATH/resolve/main/$FILENAME" \
            -O model.gguf

          echo "📄 2. 生成 Modelfile..."
          echo "FROM ./model.gguf" > Modelfile

          echo "🔨 3. 导入并打包模型..."
          ollama create $TARGET_REPO -f Modelfile

          echo "🔍 4. 【安全校验】检查本地模型列表..."
          ollama list | grep "$USERNAME"

          echo "🔍 5. 【安全校验】打印模型结构详情..."
          ollama show $TARGET_REPO

          echo "🚀 6. 推送到 Ollama Hub..."
          ollama push $TARGET_REPO

          echo "🧹 7. 清理 Runner 磁盘空间..."
          rm -f model.gguf Modelfile
